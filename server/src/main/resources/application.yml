server:
  port: 8080

spring:
  application:
    name: neurozy-voice-to-website
  profiles:
    active: dev

  datasource:
    # Uses H2 in-memory DB by default in local dev, switchable to PostgreSQL via env vars
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:neurozydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 hours

cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173,https://*.neurozy.site"
